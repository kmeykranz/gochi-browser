<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gochi Browser</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f7;
        --border: #d3d3d8;
        --text: #1d1d1f;
        --muted: #8a8a8e;
        --field: #ffffff;
        --hover: rgba(0, 0, 0, 0.07);
        --accent: #4a90d9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f1f22;
          --border: #3a3a3e;
          --text: #f2f2f4;
          --muted: #98989d;
          --field: #2c2c30;
          --hover: rgba(255, 255, 255, 0.1);
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 44px;
        overflow: hidden;
        font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        -webkit-user-select: none;
        user-select: none;
      }
      #bar {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 44px;
        padding: 0 10px;
        background: var(--bg);
        border-bottom: 1px solid var(--border);
      }
      button {
        flex: none;
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      button:hover { background: var(--hover); }
      button:active { transform: scale(0.94); }
      #address {
        flex: 1 1 auto;
        min-width: 0;
        height: 30px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 15px;
        background: var(--field);
        color: var(--text);
        font-size: 13px;
        outline: none;
        -webkit-user-select: text;
        user-select: text;
      }
      #address:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
      }
      #address::placeholder { color: var(--muted); }
      #reload.busy { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="back" title="Back">&#8249;</button>
      <button id="forward" title="Forward">&#8250;</button>
      <button id="reload" title="Reload / Stop">&#8635;</button>
      <input id="address" type="text" placeholder="Search or enter address" spellcheck="false" autocomplete="off" />
    </div>

    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;

      const address = document.getElementById("address");
      const back = document.getElementById("back");
      const forward = document.getElementById("forward");
      const reload = document.getElementById("reload");

      let loading = false;

      async function submit() {
        const url = address.value.trim();
        if (!url) return;
        address.blur();
        try {
          await invoke("navigate", { url });
        } catch (err) {
          console.error("navigate failed:", err);
        }
      }

      address.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          submit();
        } else if (e.key === "Escape") {
          address.blur();
        }
      });

      back.addEventListener("click", () => invoke("go_back").catch(console.error));
      forward.addEventListener("click", () => invoke("go_forward").catch(console.error));
      reload.addEventListener("click", () => {
        if (loading) return;
        invoke("reload").catch(console.error);
      });

      listen("nav", (e) => {
        address.value = e.payload ?? "";
      });

      listen("title", (e) => {
        const title = e.payload ? `${e.payload} - Gochi Browser` : "Gochi Browser";
        document.title = title;
      });

      listen("loading", (e) => {
        loading = Boolean(e.payload);
        reload.textContent = loading ? "\u00d7" : "\u21bb";
        reload.classList.toggle("busy", loading);
      });
    </script>
  </body>
</html>
